# Captures the README screenshots on an Android emulator and commits them to
# docs/screenshots/ whenever they change. The README embeds those files, so
# it always shows the current app. Runs on pushes to main that touch the app
# and on demand (Actions → Screenshots → Run workflow).
name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'packages/reflow_engine/lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tests/screenshots/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      locale:
        description: "UI language: en = README (docs/screenshots/), de = Play Store German (docs/screenshots/de/)"
        type: choice
        options: [en, de]
        default: en

permissions:
  contents: write # commit the updated screenshots

concurrency:
  group: screenshots-${{ github.ref }}-${{ inputs.locale || 'en' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter drive --driver=tests/screenshots/driver.dart --target=tests/screenshots/screenshots_test.dart --dart-define=SCREENSHOT_LOCALE=${{ inputs.locale || 'en' }} -d emulator-5554

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            docs/screenshots/de/*.png

      - name: Commit changed screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "docs(screenshots): update app screenshots (${{ inputs.locale || 'en' }}) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
