# Builds a signed AAB and uploads it to Google Play with fastlane
# (android/fastlane/Fastfile). The versionCode comes from Play (highest code
# + 1), the versionName from pubspec.yaml. Setup and secrets:
# docs/conventions.md ("Google Play").
name: Google Play

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "upload = build and upload, metadata = store listing, check = test API access"
        type: choice
        options: [upload, metadata, check]
        default: upload
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "draft = finish in the Play Console, completed = roll out"
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: play-upload
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        if: inputs.lane == 'upload'
        run: |
          flutter pub get
          (cd packages/reflow_engine && dart pub get)

      - name: Test
        if: inputs.lane == 'upload'
        run: flutter test tests/app tests/reflow_engine

      - name: Set up release signing
        if: inputs.lane == 'upload'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing: Play needs the upload key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Run fastlane
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          bundle exec fastlane android ${{ inputs.lane }}
          ${{ inputs.lane == 'upload' && format('track:{0} status:{1}', inputs.track, inputs.status) || '' }}

      - name: Keep the AAB as artifact
        if: always() && inputs.lane == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
